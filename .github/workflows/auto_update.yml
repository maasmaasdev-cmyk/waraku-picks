name: Daily Trend Auto-Updater

on:
  schedule:
    # 毎日 21:00 UTC (日本時間 翌朝 06:00) に自動実行
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: トレンド収集＆Geminiコピー生成の実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_trends.py

      - name: 更新データをGitHubへ自動コミット＆プッシュ
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/products.json sitemap.xml robots.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Gemini AIによるトレンド商品データの自動更新" && git push)
