<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- 和紙風の生成り背景 -->
  <rect width="1200" height="630" fill="#FAF7F0" />
  
  <!-- 暖簾（のれん）風トップボーダー -->
  <g fill="#D9381E">
    <rect x="0" y="0" width="1200" height="24" />
  </g>
  <rect x="0" y="24" width="1200" height="6" fill="#2B2B2B" />

  <!-- 外枠の二重和モダンフレーム -->
  <rect x="40" y="55" width="1120" height="535" rx="24" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="6" />
  <rect x="52" y="67" width="1096" height="511" rx="16" fill="none" stroke="#D9381E" stroke-width="2" stroke-dasharray="12,8" />

  <!-- 抹茶色のトレンドバッジ -->
  <rect x="420" y="120" width="360" height="48" rx="24" fill="#3B6E52" stroke="#2B2B2B" stroke-width="3" />
  <text x="600" y="152" font-family="sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">✨ 毎日自動更新・世界のトレンド特選</text>

  <!-- 朱印風「選」マーク -->
  <circle cx="600" cy="245" r="48" fill="#D9381E" stroke="#2B2B2B" stroke-width="4" />
  <text x="600" y="263" font-family="serif" font-size="52" font-weight="bold" fill="#FFFFFF" text-anchor="middle">選</text>

  <!-- メインタイトル -->
  <text x="600" y="365" font-family="serif" font-size="72" font-weight="bold" fill="#2B2B2B" text-anchor="middle">和楽百貨 WARAKU PICKS</text>

  <!-- サブコピー -->
  <text x="600" y="435" font-family="sans-serif" font-size="30" font-weight="bold" fill="#555555" text-anchor="middle">ガジェット・料理道具・睡眠・ご褒美グルメ・知育まで</text>
  <text x="600" y="485" font-family="sans-serif" font-size="26" fill="#D9381E" font-weight="bold" text-anchor="middle">「それどこの？」と聞かれる世界の逸品が1秒で見つかる案内所</text>
</svg>
